name: Feature request
description: Suggest an idea / Zaproponuj funkcję
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or the use case, not only the solution.
    validations:
      required: true
  - type: textarea
    id: amc
    attributes:
      label: How does Ant Movie Catalog do it?
      description: GameCatalog mirrors AMC. If AMC has this feature, describe or link it.
  - type: textarea
    id: extra
    attributes:
      label: Anything else
